plugins { id 'com.android.application' }
android {
 namespace 'vn.hansol.workarea.offline'
 compileSdk 36
 defaultConfig { applicationId 'vn.hansol.workarea.offline'; minSdk 26; targetSdk 36; versionCode 42; versionName '1.1.36' }
 signingConfigs {
  release {
   if(System.getenv('WORKAREA_KEYSTORE')) {
    storeFile file(System.getenv('WORKAREA_KEYSTORE'))
    storePassword System.getenv('WORKAREA_SIGN_PASSWORD')
    keyAlias 'workarea-offline'
    keyPassword System.getenv('WORKAREA_SIGN_PASSWORD')
   }
  }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets { main.java.srcDirs += '../shared/src/main/java' }
 buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
}
dependencies { implementation 'com.google.android.gms:play-services-wearable:20.0.1'; implementation 'androidx.work:work-runtime:2.10.5' }
