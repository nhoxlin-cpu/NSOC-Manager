plugins { id 'com.android.application' }
android {
 namespace 'vn.hansol.workarea.watch'
 compileSdk 36
 defaultConfig {
  applicationId 'vn.hansol.workarea.offline'; minSdk 30; targetSdk 36; versionCode 1; versionName '1.0.0'
  for (key in ['APP_ID','API_KEY','PROJECT_ID','SENDER_ID']) { buildConfigField 'String', 'FIREBASE_'+key, '"'+(System.getenv('WORKAREA_FIREBASE_'+key) ?: '').replace('"','\\"')+'"' }
 }
 buildFeatures { buildConfig true }
 signingConfigs { release { if(System.getenv('WORKAREA_KEYSTORE')) {storeFile file(System.getenv('WORKAREA_KEYSTORE')); storePassword System.getenv('WORKAREA_SIGN_PASSWORD'); keyAlias 'workarea-offline'; keyPassword System.getenv('WORKAREA_SIGN_PASSWORD')} } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets { main.java.srcDirs += '../shared/src/main/java'; test.java.srcDirs += '../shared/src/test/java' }
 buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
}
dependencies {
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
 testImplementation 'org.robolectric:robolectric:4.14.1'
 implementation 'com.google.android.gms:play-services-wearable:20.0.1'
 implementation 'com.google.firebase:firebase-messaging:25.1.3'
 implementation 'androidx.work:work-runtime:2.10.5'
}
